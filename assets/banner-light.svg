  </defs>
  <rect width="1760" height="576" fill="#F4F5F7"/>
  <rect width="1760" height="576" fill="url(#wash)"/>
  <rect width="1760" height="576" filter="url(#grain)" opacity="0.35"/>
  <text x="96" y="250" fill="#0B0C0E" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2.5">NAVEEN DB</text>
  <text x="100" y="318" fill="#5C6570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="500" letter-spacing="7.5">SENIOR FRONTEND ENGINEER</text>
  <rect x="100" y="352" width="420" height="1.5" fill="url(#rule)"/>
  <circle cx="1580" cy="120" r="3" fill="#9EC5C8"/>
</svg>

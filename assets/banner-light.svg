<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="576" viewBox="0 0 1760 576" role="img" aria-label="Naveen DB — Senior Frontend Engineer">
  <defs>
    <linearGradient id="wash" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9EC5C8" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#9EC5C8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#9EC5C8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b1e24" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#1b1e24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1b1e24" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 0.05 0"/>
